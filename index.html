    <style>
      .whatsapp-btn {
        position: fixed;
        bottom: 20px;

        width: 60px;

        color: white;
        border-radius: 50%;
        display: flex;

        font-size: 28px;

        z-index: 999;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .whatsapp-btn:hover {
        transform: scale(1.1) rotate(10deg);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
      }

      .whatsapp-btn::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        border-radius: 50%;
        background-color: #25d366;
        z-index: -1;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        70% {
          transform: scale(1.5);
          opacity: 0;
        }
        100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }
